<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pharmacy Cost Command Center">
  <defs>
    <linearGradient id="pcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29B5E8"/>
      <stop offset="1" stop-color="#1D5F8A"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pcc)"/>
  <!-- capsule -->
  <g transform="rotate(-40 32 30)">
    <rect x="18" y="20" width="28" height="20" rx="10" fill="#ffffff" opacity="0.95"/>
    <rect x="32" y="20" width="14" height="20" rx="10" fill="#bfe6f6"/>
    <line x1="32" y1="20" x2="32" y2="40" stroke="#1D5F8A" stroke-width="2"/>
  </g>
  <!-- trend line -->
  <polyline points="16,50 26,44 34,47 48,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="34" r="3.4" fill="#ffffff"/>
</svg>
