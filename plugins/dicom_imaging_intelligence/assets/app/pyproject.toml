[project]
name = "dicom-explorer"
version = "0.1.0"
requires-python = ">=3.11"
# Streamlit in Snowflake container runtime reads this file.
# Keep in sync with requirements.txt, which is used for local development.
dependencies = [
    "streamlit[snowflake]>=1.54.0",
    "snowflake-connector-python>=3.12.0",
    "snowflake-snowpark-python>=1.23.0",
    "plotly>=5.24.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "streamlit-floating-container>=0.2.0",
]
