# =============================================================================
# Voxel router -- nginx
#
# Serves the OHIF static bundle at / and reverse-proxies /dicom-web/* to the
# gateway container on localhost. This is the ONLY container on the public port.
# =============================================================================

upstream voxel_gateway {
    server 127.0.0.1:8080;
    # Keep connections open to the gateway. Without this every frame request
    # pays a fresh localhost TCP handshake; the incumbent documents ~100 ms of
    # TCP+TLS setup dominating small frame reads, and while localhost has no TLS
    # the per-request setup still shows up at frame-scroll rates.
    keepalive 64;
}

# =============================================================================
# CACHEABILITY IS PER-RESOURCE, NOT PER-LOCATION.
#
# Everything under /dicom-web/ used to get one header:
#
#     Cache-Control: private, max-age=86400, immutable
#
# That is correct for frame bytes and WRONG FOR EVERYTHING ELSE, and the
# difference is a governance bug, not a performance one.
#
#   * Frames and bulkdata are content. A DICOM instance never changes in place,
#     so the bytes at a frame URL are immutable by construction.
#
#   * QIDO search results and WADO-RS /metadata are a VIEW OF THE CATALOG
#     THROUGH THE CALLER'S POLICIES. Attach a masking policy, change a row
#     access policy, add a tag to the de-identification allowlist, and the same
#     URL legitimately returns different JSON. `immutable` tells the browser it
#     may serve the old copy WITHOUT REVALIDATING for a full day -- so a
#     tightened policy does not reach an open tab, and a loosened one does not
#     either. A viewer keeps rendering a stale metadata document and there is no
#     request in any log to explain why.
#
#     This actually happened here: a masking policy was attached whose allowlist
#     omitted the DICOM-SEG sequence tags, and after it was detached the browser
#     kept serving the broken metadata from cache. The fix looked like it had
#     failed. It had not -- the client was never asked.
#
# So: revalidate metadata, cache frames hard. Same trap already documented for
# the hashed static assets below, for the same reason -- a cached response
# carries its own Content-Type and status, and `immutable` means no correction
# ever lands.
#
# `private` throughout: these responses are PHI-bearing and caller-scoped, and
# must never be stored by a shared proxy.
# =============================================================================
map $uri $voxel_dicomweb_cache {
    # Default is the governance-dependent case, because that is the majority of
    # the surface and the failure mode of getting it wrong is the worse one.
    default                        "private, no-cache, must-revalidate";

    # Frame bytes: /studies/../series/../instances/../frames/1  (or 1,2,3)
    "~*/frames/[0-9,%]+/?$"        "private, max-age=86400, immutable";

    # Bulkdata is likewise raw content addressed by instance.
    "~*/bulkdata(/|$)"             "private, max-age=86400, immutable";
}

server {
    listen 8000;
    server_name _;

    # server context, NOT location -- "underscores_in_headers is not allowed here"
    # if placed in a location block. Purely defensive: the Sf-Context-* headers are
    # hyphenated, and nginx already maps hyphens to underscores when building the
    # $http_* variable name. This only matters if a future header arrives with a
    # literal underscore, which nginx would otherwise drop silently.
    underscores_in_headers on;

    # OHIF ships large .wasm codecs. Default proxy buffering would spool frame
    # responses to disk before forwarding, which destroys the streaming
    # multipart/related behaviour the frame path depends on.
    client_max_body_size 0;

    # -------------------------------------------------------------------------
    # Health. Two endpoints, deliberately distinct.
    #
    # /healthz  process liveness only. Wired to the SPCS readinessProbe.
    # /readyz   per-dependency detail, served by the gateway.
    #
    # readyz must NOT return non-200 for a merely DEGRADED dependency. If it
    # does, SPCS cycles the container on a transient hiccup and turns a
    # degradation into an outage.
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # /whoami -- the identity assertion probe.
    #
    # MUST be proxied explicitly. Without this block it falls through to
    # `location /` and `try_files ... /index.html`, so the OHIF SPA is served
    # instead and the probe returns HTML with HTTP 200.
    #
    # That is a nasty failure for a security check: the conformance harness saw
    # 200 and "non-JSON", not an error. A less careful harness that only asserted
    # on the status code would have recorded a PASS for the single most important
    # property in the system -- that queries run as the caller, not the owner.
    #
    # Uses the same Sf-Context-* forwarding as /dicom-web/, because the whole
    # point of the probe is to confirm that forwarding works.
    # =========================================================================
    location = /whoami {
        proxy_pass http://voxel_gateway/whoami;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Sf-Context-Current-User       $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }

    location = /readyz {
        proxy_pass http://voxel_gateway/readyz;
        proxy_http_version 1.1;
        # =====================================================================
        # SECURITY-CRITICAL: FORWARD THE CALLER IDENTITY HEADERS VERBATIM.
        #
        # With executeAsCaller the Snowflake ingress proxy injects these on the
        # request that arrives HERE, at nginx. The gateway builds its Snowpark
        # session from them so CURRENT_USER() is the real radiologist and row
        # access policies filter in the query engine.
        #
        # If nginx drops them, the gateway silently falls back to the service
        # OWNER's rights and EVERY ROW ACCESS POLICY QUIETLY PASSES. That is a
        # PHI disclosure with no error, no failed request, and nothing in a log.
        #
        # underscores_in_headers is set once at SERVER level above -- it is not
        # valid inside a location block and nginx refuses to start if you put it
        # here.
        #
        # Written out explicitly rather than hidden behind an include: this is
        # the authorization boundary, and it should be readable where it matters.
        # =====================================================================
        proxy_pass_request_headers on;
        proxy_set_header Sf-Context-Current-User       $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # -------------------------------------------------------------------------
    # DICOMweb. QIDO-RS / WADO-RS / STOW-RS.
    # -------------------------------------------------------------------------
    location /dicom-web/ {
        proxy_pass http://voxel_gateway;
        proxy_http_version 1.1;

        # =====================================================================
        # SECURITY-CRITICAL: FORWARD THE CALLER IDENTITY HEADERS VERBATIM.
        #
        # With executeAsCaller the Snowflake ingress proxy injects these on the
        # request that arrives HERE, at nginx. The gateway builds its Snowpark
        # session from them so CURRENT_USER() is the real radiologist and row
        # access policies filter in the query engine.
        #
        # If nginx drops them, the gateway silently falls back to the service
        # OWNER's rights and EVERY ROW ACCESS POLICY QUIETLY PASSES. That is a
        # PHI disclosure with no error, no failed request, and nothing in a log.
        #
        # underscores_in_headers is set once at SERVER level above -- it is not
        # valid inside a location block and nginx refuses to start if you put it
        # here.
        #
        # Written out explicitly rather than hidden behind an include: this is
        # the authorization boundary, and it should be readable where it matters.
        # =====================================================================
        proxy_pass_request_headers on;
        proxy_set_header Sf-Context-Current-User       $http_sf_context_current_user;
        proxy_set_header Sf-Context-Current-User-Token $http_sf_context_current_user_token;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---------------------------------------------------------------------
        # STREAMING IS MANDATORY, NOT AN OPTIMIZATION.
        #
        # SPCS ingress terminates any connection idle for 90 SECONDS. WADO-RS
        # retrieval of a full series is a long-lived multipart/related response,
        # so if nginx buffers it, the socket looks idle to the proxy while nginx
        # accumulates -- and a large series gets cut off mid-stream with no
        # clean DICOM-level error.
        #
        # proxy_buffering off forwards each multipart part the moment the gateway
        # flushes it, which keeps bytes continuously on the wire and the idle
        # timer never accumulates.
        # ---------------------------------------------------------------------
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # Comfortably under the 90 s ingress timeout so a stalled upstream read
        # fails as a proper error rather than as a truncated response.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        # Frame bytes are immutable; QIDO and /metadata are not, because they are
        # a policy-filtered view of the catalog. See the $voxel_dicomweb_cache
        # map above -- that comment is the actual explanation.
        add_header Cache-Control $voxel_dicomweb_cache always;
    }

    # -------------------------------------------------------------------------
    # OHIF static bundle.
    #
    # Content-hashed assets get immutable caching so the ~154 MB bundle is a
    # one-time cost per client rather than per cold start. index.html is
    # explicitly NOT cached, or a deploy would never reach existing sessions.
    # -------------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # =====================================================================
        # app-config.js MUST NOT BE LONG-CACHED.
        #
        # Every other asset OHIF ships is CONTENT-HASHED
        # (app.bundle.68d2c24e....js), so an immutable year-long cache is safe --
        # a new build produces a new filename and therefore a new cache key.
        #
        # app-config.js is NOT content-hashed. The filename is fixed, and it is
        # the file that carries the DICOMweb endpoints and data source settings.
        # Caching it immutable means a config change NEVER reaches a client that
        # has already loaded the app, and there is no filename change to force it.
        #
        # This block must come BEFORE the generic \.(js|css|...)$ block below,
        # because nginx picks the FIRST matching regex location.
        # =====================================================================
        location = /app-config.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
        }

        location ~* \.(js|css|wasm|woff2?|png|svg|ico)$ {
            root /usr/share/nginx/html;

            # =================================================================
            # `immutable` WAS REMOVED DELIBERATELY.
            #
            # These filenames are content-hashed, so `immutable` is technically
            # correct -- the bytes at a given URL never change. But it makes a
            # BAD DEPLOY UNRECOVERABLE from the client side.
            #
            # That is not hypothetical. The MIME bug described below served every
            # .js as application/octet-stream. Browsers cache the response
            # INCLUDING its Content-Type, and `immutable` means they never
            # revalidate -- so even after the server was fixed, clients kept
            # replaying the broken cached response and rendering a blank page.
            # The nginx access log showed `/` and the CSS being fetched and NOT A
            # SINGLE .js request, because they were all served from cache.
            #
            # A one-hour max-age with revalidation keeps the caching benefit for
            # cine playback while letting a bad deploy self-heal instead of
            # requiring every user to clear site data.
            # =================================================================
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;

            # =================================================================
            # DO NOT ADD A `types { ... }` BLOCK HERE.
            #
            # nginx's `types` directive REPLACES the inherited MIME map for this
            # location, it does not extend it. An earlier version of this file had
            #
            #     types { application/wasm wasm; }
            #     default_type application/octet-stream;
            #
            # intending to "make sure .wasm is right". Because this location
            # matches js|css|wasm, replacing the map left .js and .css with NO
            # type, so they fell through to application/octet-stream. The browser
            # then refused to execute them:
            #
            #   Refused to execute script from '.../app.bundle.js' because its
            #   MIME type ('application/octet-stream') is not executable.
            #   Failed to execute 'importScripts' on 'WorkerGlobalScope'
            #
            # Result: a completely blank viewer. The wasm check PASSED the whole
            # time, which is why it survived review -- the fix was verified, the
            # collateral damage was not.
            #
            # nginx's stock /etc/nginx/mime.types (1.27) already contains BOTH:
            #     application/javascript  js;
            #     application/wasm        wasm;
            # so the correct action here is to do nothing and inherit it.
            # =================================================================
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
        }
    }
}
